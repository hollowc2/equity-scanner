[project]
name = "equity-scanner"
version = "0.1.0"
description = "Equity morning-scan logic running against SchwabGateway (Phase 1: gateway-backed provider + scan ranking, no orchestration/Discord/news/universes yet)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "schwab-gateway-sdk",
]

[tool.uv.sources]
schwab-gateway-sdk = { git = "https://github.com/hollowc2/SchwabGateway.git", branch = "main", subdirectory = "packages/sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_scanner"]

[tool.hatch.build.targets.sdist]
exclude = ["/.env", "/.env.*", "/.git", "/.venv", "/dist"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
]
