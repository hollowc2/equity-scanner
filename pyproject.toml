[project]
name = "equity-scanner"
version = "0.2.0"
description = "Equity morning-scan running against SchwabGateway: universes, news, Discord reporting, and full CLI orchestration (Phase 2)"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "httpx>=0.27.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "pyyaml>=6.0.0",
    "schwab-gateway-sdk",
]

[project.scripts]
equity-scanner-run = "equity_scanner.run:main"
equity-scanner-refresh-universes = "equity_scanner.refresh_universes:main"

[tool.uv.sources]
schwab-gateway-sdk = { git = "https://github.com/hollowc2/SchwabGateway.git", rev = "5b8f1d76aa9fb97a300172d39e7afcc4ab60e83a", subdirectory = "packages/sdk" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equity_scanner"]

[tool.hatch.build.targets.sdist]
exclude = ["/.env", "/.env.*", "/.git", "/.venv", "/dist"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.8.0",
    "structlog>=24.0.0",
]
